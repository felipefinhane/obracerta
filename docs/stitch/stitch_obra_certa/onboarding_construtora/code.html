        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">ObraCerta</h1>
</div>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant font-label-bold text-label-bold">
            P
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-touch-target-min flex flex-col justify-center items-center px-margin-mobile md:px-8">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant p-stack-lg rounded-xl flex flex-col gap-stack-lg shadow-sm">
<!-- Header Section -->
<div class="text-center mb-4">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-weight="fill">domain</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Bem-vindo ao ObraCerta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Crie o perfil da sua construtora para começar a gerenciar suas obras.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Input: Nome da Construtora -->
<div class="flex flex-col gap-1">
<label class="font-label-bold text-label-bold text-on-surface" for="company_name">Nome da Construtora</label>
<div class="relative">
<input class="w-full h-touch-target-min px-4 bg-surface border border-outline rounded-DEFAULT text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="company_name" name="company_name" placeholder="Ex: Construtora Silva" required="" type="text"/>
</div>
</div>
<!-- Input: CNPJ (opcional) -->
<div class="flex flex-col gap-1">
<label class="font-label-bold text-label-bold text-on-surface flex items-center justify-between" for="cnpj">
                        CNPJ
                        <span class="text-on-surface-variant font-body-md text-[12px] font-normal">Opcional</span>
</label>
<div class="relative">
<input class="w-full h-touch-target-min px-4 bg-surface border border-outline rounded-DEFAULT text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" type="text"/>
</div>
</div>
<!-- Spacer -->
<div class="h-4"></div>
<!-- Button: Continuar -->
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-container hover:opacity-90 active:scale-[0.98] transition-all rounded-DEFAULT font-button-text text-button-text flex items-center justify-center gap-2 mt-4 shadow-sm" type="button">
                    Continuar
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- BottomNavBar and FAB suppressed as per guidelines for Onboarding/Transactional screens -->
</body></html>
