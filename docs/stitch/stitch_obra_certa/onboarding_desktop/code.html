<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
<div class="grid grid-cols-1 md:grid-cols-2 min-h-screen w-full">
<!-- Left Column: Form -->
<div class="flex flex-col justify-center items-center px-margin-mobile md:px-12 lg:px-24 py-stack-lg bg-surface relative z-10">
<div class="w-full max-w-[480px]">
<!-- Brand Anchor -->
<div class="flex items-center gap-2 mb-16 text-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">construction</span>
<span class="font-headline-md tracking-tight">ObraCerta</span>
</div>
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg text-on-surface mb-stack-sm tracking-tight">Bem-vindo ao ObraCerta</h1>
<p class="font-body-lg text-on-surface-variant">Crie o perfil da sua construtora para começar.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Input: Nome da Construtora -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-on-surface" for="companyName">Nome da Construtora</label>
<input class="h-touch-target-min px-4 bg-surface-container-lowest border border-on-surface text-on-surface rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all placeholder:text-outline-variant font-body-md" id="companyName" placeholder="Ex: Engenharia Estrutural S.A." type="text">
</div>
<!-- Input: CNPJ (opcional) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-on-surface flex justify-between" for="cnpj">
<span class="">CNPJ</span>
<span class="text-on-surface-variant font-normal tracking-normal">(opcional)</span>
</label>
<input class="h-touch-target-min px-4 bg-surface-container-lowest border border-on-surface text-on-surface rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all placeholder:text-outline-variant font-body-md" id="cnpj" placeholder="00.000.000/0000-00" type="text">
</div>
<!-- Action -->
<div class="mt-stack-sm">
<button class="w-full h-touch-target-min bg-secondary-container text-white font-button-text rounded-DEFAULT hover:bg-secondary active:bg-secondary-container transition-colors duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
                            Continuar
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<!-- Right Column: Visual Anchor -->
<div class="hidden md:block relative bg-surface-container-high border-l border-outline-variant overflow-hidden">
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply z-10"></div>

</div>
