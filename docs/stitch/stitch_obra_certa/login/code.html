        body { font-family: 'Inter', sans-serif; }

      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen flex flex-col justify-center items-center p-margin-mobile">
<!-- Top App Bar equivalent for Login (Brand focus) -->
<header class="w-full max-w-md mb-stack-lg flex justify-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">ObraCerta</h1>
</header>
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile">
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email</label>
<input class="min-h-[48px] px-3 border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded" id="email" name="email" required="" type="email" value="gerente@obracerta.com"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Senha</label>
<div class="relative">
<input class="w-full min-h-[48px] px-3 border border-error focus:border-error focus:ring-1 focus:ring-error outline-none bg-error-container text-on-surface font-body-md text-body-md rounded pr-12" id="password" name="password" required="" type="password" value="wrongpassword"/>
<button class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Error State Alert -->
<div class="bg-error-container border-l-4 border-error p-3 flex items-start gap-3 rounded-r" role="alert">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="error">error</span>
<p class="font-body-md text-body-md text-on-error-container m-0">Senha incorreta. Tente novamente ou recupere sua senha.</p>
</div>
<div class="flex justify-end">
<a class="font-body-md text-body-md text-primary hover:underline" href="#">Esqueceu a senha?</a>
</div>
<button class="w-full min-h-[48px] bg-secondary-container text-on-secondary-container font-button-text text-button-text rounded mt-stack-sm flex items-center justify-center transition-colors hover:bg-secondary hover:text-on-secondary" type="submit">
                Entrar
            </button>
</form>
<div class="mt-stack-lg text-center border-t border-outline-variant pt-stack-md">
<span class="font-body-md text-body-md text-on-surface-variant">Ainda não tem conta?</span>
<a class="font-button-text text-button-text text-primary hover:underline ml-2" href="#">Criar conta</a>
</div>
</main>
</body></html>
