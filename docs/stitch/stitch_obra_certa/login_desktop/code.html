<style>
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Decorative background elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-10">
<span class="material-symbols-outlined text-[40rem] text-primary-container" style="font-variation-settings: 'FILL' 0;">
            construction
        </span>
</div>
<!-- Main Container -->
<main class="w-full max-w-md relative z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-lg shadow-sm">
<!-- Header Section -->
<div class="text-center mb-stack-lg flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-sm">
<span class="material-symbols-outlined text-on-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">
                        engineering
                    </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">ObraCerta</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Acesse sua conta para continuar.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-base" for="email">E-mail Corporativo</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-on-surface rounded bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent min-h-touch-target-min transition-shadow" id="email" name="email" placeholder="gestor@construtora.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-base">
<label class="block font-label-bold text-label-bold text-on-surface" for="password">Senha de Acesso</label>
<a class="font-label-bold text-label-bold text-secondary-container hover:text-secondary hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-secondary-container rounded px-1" href="#">Esqueci a senha</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-on-surface rounded bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent min-h-touch-target-min transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-stack-sm w-full bg-secondary-container hover:bg-secondary text-on-secondary font-button-text text-button-text py-3 px-4 rounded min-h-touch-target-min flex items-center justify-center gap-2 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary-container focus:ring-offset-background active:border-2 active:border-inset active:border-secondary-fixed" type="submit">
<span>Entrar no Sistema</span>
<span class="material-symbols-outlined" style="font-size: 20px;">login</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Ainda não tem acesso? 
                <a class="font-label-bold text-label-bold text-primary hover:text-primary-container hover:underline transition-colors ml-1 focus:outline-none focus:ring-2 focus:ring-primary rounded px-1" href="#">Solicite uma conta</a>
</p>
</div>
</main>
<script>
        // Simple password visibility toggle
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function(e) {
            e.preventDefault();
            const input = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
