<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Novo Lançamento de Diário - ObraCerta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e5e2e1",
                        "tertiary": "#011f05",
                        "on-primary-fixed": "#001b3d",
                        "outline-variant": "#c3c6d0",
                        "primary-container": "#002d5e",
                        "inverse-surface": "#313030",
                        "surface-bright": "#fcf9f8",
                        "background": "#fcf9f8",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#032107",
                        "on-tertiary-container": "#7c9e78",
                        "tertiary-container": "#163418",
                        "surface-container-low": "#f6f3f2",
                        "surface-dim": "#dcd9d9",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb693",
                        "surface": "#fcf9f8",
                        "tertiary-fixed": "#c7ecc2",
                        "surface-tint": "#3e5f92",
                        "primary-fixed": "#d6e3ff",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-surface-variant": "#43474f",
                        "outline": "#747780",
                        "on-primary-fixed-variant": "#244779",
                        "error-container": "#ffdad6",
                        "on-background": "#1c1b1b",
                        "surface-container": "#f0eded",
                        "surface-container-highest": "#e5e2e1",
                        "on-secondary-container": "#572000",
                        "primary": "#001939",
                        "on-primary-container": "#7696cd",
                        "secondary-container": "#fe6b00",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1c1b1b",
                        "secondary": "#a04100",
                        "on-secondary-fixed-variant": "#7a3000",
                        "inverse-primary": "#a9c7ff",
                        "secondary-fixed": "#ffdbcc",
                        "surface-container-high": "#eae7e7",
                        "tertiary-fixed-dim": "#acd0a7",
                        "primary-fixed-dim": "#a9c7ff",
                        "on-secondary-fixed": "#351000",
                        "on-tertiary-fixed-variant": "#2f4e2f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "base": "8px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "button-text": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-stack-sm text-primary dark:text-primary-fixed">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center hover:bg-surface-container-high dark:hover:bg-surface-variant rounded-full transition-opacity active:opacity-80">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">ObraCerta</h1>
</div>
<div class="h-10 w-10 bg-surface-variant rounded-full flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-outline">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[49px] mb-[65px] p-margin-mobile overflow-y-auto space-y-stack-lg">
<!-- Page Title -->
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Novo Lançamento</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Registre as atividades do dia na obra.</p>
</div>
<!-- Upload Foto -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile flex flex-col items-center justify-center gap-stack-sm min-h-[160px] cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[48px] text-primary">add_a_photo</span>
<span class="font-label-bold text-label-bold text-primary text-center">Adicionar Fotos do Dia</span>
<span class="font-body-md text-[12px] text-on-surface-variant text-center">Tire fotos do progresso atual</span>
</div>
<!-- Clima -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-margin-mobile space-y-stack-md">
<h3 class="font-label-bold text-label-bold text-on-surface">Clima do Dia</h3>
<div class="flex gap-margin-mobile">
<button class="flex-1 h-touch-target-min flex flex-col items-center justify-center border border-outline-variant rounded bg-surface-container-lowest hover:bg-surface-container transition-colors active:bg-secondary-container active:text-on-secondary-container active:border-secondary-container">
<span class="material-symbols-outlined mb-1">light_mode</span>
<span class="text-[12px] font-label-bold">Sol</span>
</button>
<button class="flex-1 h-touch-target-min flex flex-col items-center justify-center border border-primary bg-primary-fixed text-on-primary-fixed rounded">
<span class="material-symbols-outlined mb-1 icon-fill">cloud</span>
<span class="text-[12px] font-label-bold">Nublado</span>
</button>
<button class="flex-1 h-touch-target-min flex flex-col items-center justify-center border border-outline-variant rounded bg-surface-container-lowest hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined mb-1">rainy</span>
<span class="text-[12px] font-label-bold">Chuva</span>
</button>
</div>
</div>
<!-- Formulário -->
<div class="space-y-stack-md">
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1">Atividades e Progresso</label>
<textarea class="w-full border border-outline rounded bg-surface-container-lowest p-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="Descreva o que foi feito hoje..." rows="4"></textarea>
</div>
<div class="flex gap-margin-mobile">
<div class="flex-1 flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1">Efetivo (Pessoas)</label>
<input class="w-full h-touch-target-min border border-outline rounded bg-surface-container-lowest px-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Ex: 12" type="number"/>
</div>
<div class="flex-1 flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1">Ocorrências</label>
<input class="w-full h-touch-target-min border border-outline rounded bg-surface-container-lowest px-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Ex: 0" type="number"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1">Etapa Vinculada (Opcional)</label>
<div class="relative">
<select class="w-full h-touch-target-min border border-outline rounded bg-surface-container-lowest px-3 text-on-surface font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none">
<option value="">Selecione uma etapa...</option>
<option value="1">Fundações</option>
<option value="2">Alvenaria</option>
<option value="3">Instalações Elétricas</option>
<option value="4">Acabamento</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary font-button-text text-button-text rounded flex items-center justify-center gap-2 hover:opacity-90 transition-opacity mt-stack-lg">
<span class="material-symbols-outlined text-[20px]">publish</span>
            Publicar no Diário
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter-mobile py-2 bg-surface dark:bg-on-background border-t border-outline-variant dark:border-outline md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-surface-container dark:hover:bg-surface-variant transition-transform duration-100">
<span class="material-symbols-outlined">engineering</span>
<span class="font-label-bold text-[10px] mt-1">Obras</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-surface-container dark:hover:bg-surface-variant transition-transform duration-100">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-bold text-[10px] mt-1">Despesas</span>
</button>
<!-- Active State -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 scale-95 transition-transform duration-100">
<span class="material-symbols-outlined icon-fill">assignment</span>
<span class="font-label-bold text-[10px] mt-1">Diário</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-surface-container dark:hover:bg-surface-variant transition-transform duration-100">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-bold text-[10px] mt-1">Relatórios</span>
</button>
</nav>
</body></html>
