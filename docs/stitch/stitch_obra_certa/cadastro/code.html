<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Main Container: Glassmorphism / Modern Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm relative overflow-hidden">
<!-- Decorative Header Element -->
<div class="absolute top-0 left-0 w-full h-2 bg-secondary-container"></div>
<!-- Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm md:font-headline-lg md:text-headline-lg">ObraCerta</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">Cadastro</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">
                Crie sua conta para gerenciar suas obras de forma eficiente. O login é imediato logo após o cadastro.
            </p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-base relative">
<label class="font-label-bold text-label-bold text-on-surface absolute -top-2 left-3 bg-surface-container-lowest px-1 z-10" for="email">Email</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 text-on-surface-variant">mail</span>
<input class="w-full h-touch-target-min pl-10 pr-3 bg-surface-container-lowest border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base relative mt-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface absolute -top-2 left-3 bg-surface-container-lowest px-1 z-10" for="password">Senha</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 text-on-surface-variant">lock</span>
<input class="w-full h-touch-target-min pl-10 pr-10 bg-surface-container-lowest border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar senha" class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors h-full flex items-center justify-center" type="button">
<span aria-hidden="true" class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target-min mt-stack-lg bg-secondary-container hover:bg-secondary text-on-secondary-container hover:text-on-secondary rounded-lg font-button-text text-button-text flex items-center justify-center gap-base transition-colors duration-200 active:scale-[0.98]" type="submit">
<span>Cadastrar e Começar</span>
<span aria-hidden="true" class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer / Switch to Login -->
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant">
            Já tem uma conta? <a class="font-label-bold text-label-bold text-primary hover:underline underline-offset-4" href="#">Fazer Login</a>
</div>
</main>
<!-- Contextual Visual (Optional: Hidden on small mobile, visible on larger screens alongside form if layout permitted, but kept centered here for direct focus) -->
<div class="hidden lg:block fixed bottom-0 right-0 p-stack-lg w-1/3 opacity-50 -z-10 pointer-events-none">
<div class="bg-cover bg-center w-full h-64 rounded-xl border border-outline-variant" data-alt="A blueprint architectural drawing of a modern construction project spread across a wooden table, illuminated by warm afternoon sunlight coming through a nearby window. High contrast, technical aesthetic, conveying precision and robust engineering." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBqbVhqKZj_42ApqKH3TsGLf0z0Puz2ILMwNGvq_tgbTdvJrfUV2Pjo5X_ClEXL0g8UdOxOXLnA8pAfZU1pJL13GUrJGPd1Ui3mQUToRrApHYJhozFtZAJuJHUOAE0QlYkNpriS8p6RywhxivsC7V0MZ6wsVjCyPPhxMvcX9HIH8a5HSZ2LeC3NEYifR-UCtWBCWRs2SZ-rqQPpja4aUQRdrR00TOc9CXEiIz7AfpdVP0NKL-QAfz2M')"></div>
