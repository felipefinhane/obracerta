<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro - ObraCerta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#1c1b1b",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "surface-bright": "#fcf9f8",
                        "outline": "#747780",
                        "inverse-primary": "#a9c7ff",
                        "tertiary-fixed": "#c7ecc2",
                        "on-tertiary-fixed-variant": "#2f4e2f",
                        "surface-tint": "#3e5f92",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#572000",
                        "secondary-container": "#fe6b00",
                        "secondary-fixed-dim": "#ffb693",
                        "on-primary-fixed": "#001b3d",
                        "inverse-surface": "#313030",
                        "on-primary-fixed-variant": "#244779",
                        "on-secondary-fixed": "#351000",
                        "surface": "#fcf9f8",
                        "on-surface-variant": "#43474f",
                        "surface-dim": "#dcd9d9",
                        "primary": "#001939",
                        "tertiary": "#011f05",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c3c6d0",
                        "error": "#ba1a1a",
                        "surface-container": "#f0eded",
                        "secondary-fixed": "#ffdbcc",
                        "on-secondary-fixed-variant": "#7a3000",
                        "on-primary-container": "#7696cd",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#163418",
                        "surface-container-high": "#eae7e7",
                        "tertiary-fixed-dim": "#acd0a7",
                        "on-tertiary-container": "#7c9e78",
                        "inverse-on-surface": "#f3f0ef",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e5e2e1",
                        "primary-fixed": "#d6e3ff",
                        "primary-container": "#002d5e",
                        "on-secondary": "#ffffff",
                        "background": "#fcf9f8",
                        "on-tertiary-fixed": "#032107",
                        "on-background": "#1c1b1b",
                        "surface-container-low": "#f6f3f2",
                        "secondary": "#a04100",
                        "primary-fixed-dim": "#a9c7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "margin-mobile": "16px",
                        "base": "8px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "button-text": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Background Pattern -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(#1c1b1b 1px, transparent 1px); background-size: 24px 24px;"></div>
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-lg shadow-sm relative z-10">
<!-- Header -->
<div class="text-center mb-stack-lg flex flex-col items-center">
<div class="h-12 w-12 bg-primary rounded-lg flex items-center justify-center mb-stack-sm border border-outline-variant">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-icon="construction">construction</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-stack-sm">ObraCerta</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">Cadastro</h2>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-touch-target-min pl-10 pr-4 bg-surface-container border border-on-surface rounded focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors" id="email" name="email" placeholder="gestor@obra.com.br" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-touch-target-min pl-10 pr-4 bg-surface-container border border-on-surface rounded focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min mt-stack-sm bg-secondary-container text-on-primary font-button-text text-button-text rounded flex items-center justify-center gap-2 hover:bg-secondary transition-colors active:ring-2 active:ring-inset active:ring-secondary-fixed" type="submit">
                Cadastrar e Começar
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Informative Text -->
<div class="mt-stack-lg p-stack-sm bg-surface-container-low border border-outline-variant rounded flex gap-3 items-start">
<span class="material-symbols-outlined text-on-surface-variant shrink-0 mt-0.5" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant m-0">
                Após o cadastro, você será redirecionado imediatamente para o diário de obras.
            </p>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Já tem uma conta? 
                <a class="font-label-bold text-label-bold text-primary hover:underline" href="#">Fazer login</a>
</p>
</div>
</main>
<script>
        // Simple micro-interaction for button press
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
