<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nova Obra - ObraCerta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            extend: {

                      "on-tertiary-container": "#7c9e78",

                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed-dim": "#ffb693",
                      "surface": "#fcf9f8",

                      "surface-tint": "#3e5f92",
                      "primary-fixed": "#d6e3ff",
                      "on-error": "#ffffff",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#f3f0ef",
                      "on-surface-variant": "#43474f",
                      "outline": "#747780",
                      "on-primary-fixed-variant": "#244779",
                      "error-container": "#ffdad6",
                      "on-background": "#1c1b1b",
                      "surface-container": "#f0eded",
                      "surface-container-highest": "#e5e2e1",
                      "on-secondary-container": "#572000",
                      "primary": "#001939",
                      "on-primary-container": "#7696cd",
                      "secondary-container": "#fe6b00",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#1c1b1b",
                      "secondary": "#a04100",
                      "on-secondary-fixed-variant": "#7a3000",
                      "inverse-primary": "#a9c7ff",
                      "secondary-fixed": "#ffdbcc",
                      "surface-container-high": "#eae7e7",
                      "tertiary-fixed-dim": "#acd0a7",
                      "primary-fixed-dim": "#a9c7ff",
                      "on-secondary-fixed": "#351000",
                      "on-tertiary-fixed-variant": "#2f4e2f"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "stack-lg": "24px",
                      "margin-mobile": "16px",
                      "touch-target-min": "48px",
                      "base": "8px",
                      "stack-sm": "8px",
                      "stack-md": "16px",
                      "gutter-mobile": "12px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Inter"],
                      "button-text": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-bold": ["Inter"],
                      "headline-md": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "button-text": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}]

          },
        }

<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pt-[48px] pb-0 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface text-primary border-b border-outline-variant">
<div class="flex items-center gap-2">
<button aria-label="Voltar" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Nova Obra</h1>
</div>
<div class="flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full overflow-hidden border border-outline-variant">
<img alt="Profile Photo" class="object-cover w-full h-full" data-alt="A small, professional portrait photograph of a construction manager wearing a hard hat, smiling confidently. Bright daylight, clear lighting, modern corporate style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuATxgzAQg6v4AbwQPZjlPvGRcFhIRtf6kHSDjBgAbyImaK6dDHF4vS6_-OhPP55CFSR-_RdcMOvqab5uynC_DD4ZGqcfNqKiSgKx8NNWP5j51FgrHDtdAY7pj10no_qhFy1UjfLpXpdRFK52GPxAFE_2LBkk1u5C2UeH5CMSkz_hjid1Vg9bb8ZMUolbWTn70vDS08Ewf1xU_q8AASPzESuzBHa5CgYDZNDbP-yaw-0FDj49uzsfvka"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-lg max-w-2xl mx-auto w-full">
<form action="#" class="space-y-stack-lg bg-surface-container-lowest p-4 border border-outline-variant rounded-lg" method="POST">
<div class="space-y-stack-md">
<h2 class="font-headline-md text-headline-md font-bold text-primary border-b-2 border-outline-variant pb-2">Informações da Obra</h2>
<!-- Nome da Obra -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_nome">Nome da Obra *</label>
<input class="h-touch-target-min px-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_nome" name="obra_nome" placeholder="Ex: Residencial Flores" required="" type="text"/>
</div>
<!-- Endereço -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_endereco">Endereço *</label>
<input class="h-touch-target-min px-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_endereco" name="obra_endereco" placeholder="Rua, Número, Bairro, Cidade" required="" type="text"/>
</div>
<!-- Nome do Cliente -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_cliente">Nome do Cliente</label>
<input class="h-touch-target-min px-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_cliente" name="obra_cliente" placeholder="Nome completo ou Empresa" type="text"/>
</div>
</div>
<div class="space-y-stack-md pt-stack-sm">
<h2 class="font-headline-md text-headline-md font-bold text-primary border-b-2 border-outline-variant pb-2">Planejamento Financeiro e Prazos</h2>
<!-- Valor Total Planejado -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_valor">Valor Total Planejado (R$) *</label>
<div class="relative">
<span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant font-body-md text-body-md">R$</span>
<input class="w-full h-touch-target-min pl-10 pr-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_valor" min="0" name="obra_valor" placeholder="0,00" required="" step="0.01" type="number"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Data de Início -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_inicio">Data de Início *</label>
<input class="h-touch-target-min px-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_inicio" name="obra_inicio" required="" type="date"/>
</div>
<!-- Data de Fim Prevista -->
<div class="flex flex-col">
<label class="font-label-bold text-label-bold text-on-surface mb-1" for="obra_fim">Data de Fim Prevista</label>
<input class="h-touch-target-min px-3 border border-outline rounded bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md" id="obra_fim" name="obra_fim" type="date"/>
</div>
</div>
</div>
<div class="pt-stack-lg flex flex-col md:flex-row gap-stack-md">
<button class="w-full md:w-1/3 h-touch-target-min border-2 border-outline text-on-surface-variant font-button-text text-button-text rounded flex items-center justify-center hover:bg-surface-container-high transition-colors" type="button">
                    Cancelar
                </button>
<button class="w-full md:w-2/3 h-touch-target-min bg-secondary-container text-on-secondary font-button-text text-button-text rounded flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" type="submit">
<span class="material-symbols-outlined" data-icon="save">save</span>
                    Salvar Obra
                </button>
</div>
</form>
</main>
</body></html>
